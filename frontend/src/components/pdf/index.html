<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Listado de Personajes</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>

    <div class="pdf-container">

        <!-- Página -->
        <div class="pdf-page">

            <!-- Header -->
            <header class="pdf-header">
                <h1>Listado de Personajes</h1>
                <div class="subtitle">Reporte Oficial</div>
            </header>

            <!-- Grid de tarjetas -->
            <section class="cards-container" id="cardsContainer">
                <!-- Las tarjetas se insertan dinámicamente -->
            </section>

            <!-- Footer -->
            <footer class="pdf-footer">
                Página <span class="page-number"></span>
            </footer>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
